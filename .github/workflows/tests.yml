name: SiteGuard tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'opencv-python-headless==4.11.0.86' 'numpy==1.26.4'
      - run: python -m unittest discover -s tests -v
      - run: ./scripts/run_mock.sh --benchmark --database /tmp/siteguard-ci.sqlite3
      - run: ./scripts/test_firmware_host.sh
  legacy-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo python:3.6.15-buster python -m unittest discover -s tests -v
